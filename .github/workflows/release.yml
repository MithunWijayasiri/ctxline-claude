name: Release

# Manually triggered. Publishes to npm via Trusted Publishing (OIDC, no token secret —
# the trusted publisher on npmjs.com must name this file), then creates a matching GitHub release with:
# - the statusline preview (colors stripped, GitHub markdown can't render ANSI)
# - auto-generated notes from commits/PRs since the previous release
# - two zip assets: ctxline-claude-code (the npm package contents) and ctxline-claude-desktop (the desktop
#   plugin, at whatever version desktop/.claude-plugin/plugin.json holds — it has no releases of its
#   own). GitHub still attaches its automatic Source code (zip/tar.gz); that can't be disabled.
#
# Bump the version in BOTH package.json and the VERSION constant in statusline.js before
# running — the installers copy statusline.js alone, so it carries its own version for the
# update check. `npm test` asserts the two match and fails the release if they drift.
# npm also rejects re-publishing an existing version (and the release step refuses a
# duplicate tag).

on:
  workflow_dispatch:   # version comes from package.json — bump it (and statusline.js's VERSION) in a commit first

permissions:
  contents: write   # required to create the tag + release
  id-token: write   # OIDC token for npm Trusted Publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # Trusted Publishing needs npm >= 11.5.1
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve tag
        id: ver
        run: |
          V="$(node -p "require('./package.json').version")"
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$'; then
            echo "::error::Invalid version '$V' in package.json — expected semver like 1.2.3."
            exit 1
          fi
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: npm test

      - name: Use npm readme
        run: cp npm/README.md README.md

      - name: Publish to npm
        run: npm publish

      - name: Render statusline preview
        # preview.js prints several scenarios for the CI visual sync-check; 
        # the release body only wants the primary line (first line), colors stripped.
        run: node scripts/preview.js | perl -pe 's/\x1b\[[0-9;]*m//g' | head -n 1 > preview.txt

      - name: Build zip assets
        run: |
          V="$(node -p "require('./package.json').version")"
          DV="$(node -p "require('./desktop/.claude-plugin/plugin.json').version")"

          npm pack --silent
          mkdir ctxline-pkg && tar -xzf "ctxline-claude-$V.tgz" -C ctxline-pkg
          (cd ctxline-pkg/package && zip -qr "$GITHUB_WORKSPACE/ctxline-claude-code-v$V.zip" .)

          (cd desktop && zip -qr "$GITHUB_WORKSPACE/ctxline-claude-desktop-v$DV.zip" .)

          echo "pkg_version=$V" >> "$GITHUB_ENV"
          echo "desktop_version=$DV" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists — bump the version in package.json first."
            exit 1
          fi

          NOTES="$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body)"

          {
            echo "### Statusline preview"
            echo ""
            echo "_Sample line — colors render in a real terminal; stripped here._"
            echo ""
            echo '```text'
            cat preview.txt
            echo '```'
            echo ""
            echo "### Downloads"
            echo ""
            echo "- \`ctxline-claude-code-v${pkg_version}.zip\` — statusline (same contents as the npm package)"
            echo "- \`ctxline-claude-desktop-v${desktop_version}.zip\` — Claude desktop plugin v${desktop_version} (updates itself through the plugin marketplace; not versioned with this release)"
            echo ""
            echo "$NOTES"
          } > body.md

          gh release create "$TAG" --title "$TAG" --notes-file body.md \
            "ctxline-claude-code-v${pkg_version}.zip" \
            "ctxline-claude-desktop-v${desktop_version}.zip"
