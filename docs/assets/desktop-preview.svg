    <rect x="196.8" y="287" width="16.8" height="16" fill="#fb923c"></rect>
    <rect x="213.6" y="287" width="75.6" height="16" fill="#22d3ee"></rect>
    <rect x="289.2" y="287" width="138.6" height="16" fill="#4b5160"></rect>
    <rect x="427.8" y="287" width="508.2" height="16" fill="#2e3240"></rect>
