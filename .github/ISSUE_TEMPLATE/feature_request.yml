name: Feature / enhancement
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      description: Which part of ctxline is this for?
      options:
        - ctxline-claude-code
        - ctxline-claude-desktop
        - ctxline-claude-desktop-themes
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or annoying today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
