    <text x="96" y="333" font-size="14" fill="#8f8c84"><tspan fill="#a78bfa">■</tspan> sys 3k<tspan fill="#60a5fa" dx="16">■</tspan> tools 12k<tspan fill="#f472b6" dx="16">■</tspan> mcp 6k<tspan fill="#34d399" dx="16">■</tspan> agents 1k<tspan fill="#fde047" dx="16">■</tspan> mem 2k<tspan fill="#fb923c" dx="16">■</tspan> skills 4k<tspan fill="#22d3ee" dx="16">■</tspan> msgs 18k<tspan fill="#8b92a3" dx="16">▨</tspan> buffer 33k</text>

    <g transform="translate(0 40)">
    <!-- Prompt -->
    <rect x="40" y="324" width="1200" height="60" rx="14" fill="#1c1c1c" stroke="#3a3a3a"></rect>
    <text x="64" y="360" font-size="16" fill="#77756e">Type / for commands</text>
    <path d="M1206 351 v7 h-13 m4 -4 l-4 4 l4 4" stroke="#8f8c84" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>

