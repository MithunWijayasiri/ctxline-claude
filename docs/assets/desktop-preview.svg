    <text x="1196" y="416" text-anchor="end"><tspan fill="#22c55e">H12</tspan><tspan fill="#8f8c84"> ↺ 1h28m  │  </tspan><tspan fill="#22c55e">W25</tspan><tspan fill="#8f8c84"> ↺ 15h48m</tspan><tspan fill="#e8e6df" dx="26">Opus 5.5</tspan><tspan fill="#e8e6df" dx="22">Medium</tspan></text>
    <circle cx="1224" cy="411" r="7" fill="none" stroke="#2e2e2e" stroke-width="2"></circle>
